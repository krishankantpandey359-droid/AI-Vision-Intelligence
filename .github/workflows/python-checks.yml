name: Python project checks

on:
  pull_request:
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/gesture_features.csv"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/gesture_features.csv"
      - ".github/workflows/python-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn streamlit pytest
      - name: Compile Python files
        run: python -m compileall -q src dashboard
      - name: Run dataset validation tests
        run: pytest -q tests/
      - name: Smoke-test Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("dashboard/app.py").run()
          assert not app.exception
          PY
