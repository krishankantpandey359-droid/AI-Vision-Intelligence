name: Python project checks

on:
  pull_request:
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/gesture_features.csv"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/gesture_features.csv"
      - ".github/workflows/python-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn streamlit pytest
      - name: Compile Python files
        run: python -m compileall -q src dashboard
      - name: Run dataset validation tests
        run: pytest -q tests/
      - name: Run reproducible held-out model evaluation
        run: python src/evaluate_models.py
      - name: Validate machine-readable evaluation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("outputs/model_evaluation.json").read_text(encoding="utf-8"))
          assert report["samples"] == 1000
          assert report["features"] == 63
          assert report["split"]["train_rows"] == 800
          assert report["split"]["test_rows"] == 200
          assert len(report["dataset_sha256"]) == 64
          assert set(report["models"]) == {
              "Logistic Regression", "KNN", "Random Forest", "SVM"
          }
          for metrics in report["models"].values():
              for key in ("accuracy", "balanced_accuracy", "macro_f1"):
                  assert 0.0 <= metrics[key] <= 1.0
              assert len(metrics["confusion_matrix"]) == 5
          print("PASS: held-out evaluation report is complete and valid.")
          PY
      - name: Smoke-test Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("dashboard/app.py").run()
          assert not app.exception
          PY
