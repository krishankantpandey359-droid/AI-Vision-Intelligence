name: Python project checks

on:
  pull_request:
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/**"
      - "models/gesture_random_forest.pkl"
      - ".github/workflows/python-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dashboard/**"
      - "tests/**"
      - "data/**"
      - "models/gesture_random_forest.pkl"
      - ".github/workflows/python-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn streamlit pytest joblib
      - name: Compile Python files
        run: python -m compileall -q src dashboard tests
      - name: Validate and evaluate committed model artifact
        run: python src/evaluate_committed_model.py
      - name: Run dataset and evaluation tests
        run: pytest -q tests/
      - name: Retrain Random Forest from committed engineered data
        run: python src/save_model.py
      - name: Smoke-test Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("dashboard/app.py").run()
          assert not app.exception
          PY
      - name: Upload committed and retrained model evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-heldout-evaluation
          path: |
            outputs/committed_model/metrics.json
            outputs/committed_model/confusion_matrix.csv
            outputs/retrained_model/metrics.json
            outputs/retrained_model/confusion_matrix.csv
          if-no-files-found: error
          retention-days: 14
